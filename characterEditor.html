<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jazz Character Editor</title>
    <link rel="stylesheet" href="./editor.css">
</head>
<body>
    <div class="main-editor-window">
        <div class="top-toolbar">
            <div class="dropdown">
                <button class="dropbtn">File</button>
                <div class="dropdown-content">
                    <a href="#" id="menu-new">New Project</a>
                    <a href="#" id="menu-open">Open Project</a>
                    <a href="#" id="menu-save">Save Project</a>
                    <a href="#" id="menu-export">Export Config</a>
                </div>
            </div>
        </div>
        <div class="left-panel" id="left-panel"></div>
        <div class="editor-canvas-container" id="editor-canvas-container">
            <canvas id="editor-canvas"></canvas>
        </div>
        <div class="right-panel" id="right-panel"></div>
        <div class="bottom-panel" id="bottom-panel"></div>
    </div>
    <script type="module" src="./characterEditor.js"></script>
</body>
